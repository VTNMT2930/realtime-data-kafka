events { worker_connections 1024; }

http {
    # QUAN TRỌNG: Phải có dòng này để trình duyệt hiểu file CSS, JS
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Định nghĩa các nhóm Backend
    upstream producer_backend {
        server api-producer:3000;
    }
    upstream consumer_backend {
        server consumer-service:3001;
    }

    # Server HTTP (Chuyển hướng sang HTTPS)
    server {
        listen 80;
        server_name nhanit.id.vn www.nhanit.id.vn;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Server HTTPS (Chính)
    server {
        listen 443 ssl;
        server_name nhanit.id.vn www.nhanit.id.vn;

        # ✅ ĐƯỜNG DẪN CHỨNG CHỈ (Đã mount vào docker)
        ssl_certificate /etc/letsencrypt/live/nhanit.id.vn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nhanit.id.vn/privkey.pem;

        # (Copy toàn bộ các location /, /api..., /socket... xuống đây)
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        location /api/producers/ {
            proxy_pass http://producer_backend/producers/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location /api/admin/ {
            proxy_pass http://producer_backend/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/consumers/ {
            proxy_pass http://consumer_backend/consumers/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /socket.io/ {
            proxy_pass http://producer_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}